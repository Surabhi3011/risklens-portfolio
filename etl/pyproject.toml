[project]
name = "risklens-etl"
version = "0.1.0"
description = "RiskLens Portfolio ETL: enrich a property portfolio with open EPC, flood and HPI data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "pyarrow>=16.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risklens_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
